<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Toc-Toe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="shortcut icon" href="flav.png" type="image/x-icon">
    <style>
        .block {
            width: 70px;
            height: 70px;
        }

        @media screen and (min-width:576px) {
            .block {
                width: 110px;
                height: 110px;
            }
        }

        @media screen and (min-width:768px) {
            .block {
                width: 135px;
                height: 135px;
            }
        }
    </style>
</head>

<body>
    <h1 class="text-center rounded text-light bg-primary fw-semibold py-2 container mb-5">
        Tic Tac Toe
    </h1>
    <div class="container d-flex mb-3 align-items-center gap-2 bg-danger justify-content-center rounded-2 shadow">
        <p class="fs-4 fw-bold text-white my-auto">Choose Mode</p>
        <select id="sel">
            <option value="pc">Player V/S Computer</option>
            <option value="pp">Player V/S Player</option>
        </select>
    </div>
    <div class="container d-flex flex-column justify-content-center align-items-center">
        <div class="d-flex">
            <button class="fs-1 btn btn-outline-success block" onclick="game(1)"></button>
            <button class="fs-1 btn btn-outline-success block" onclick="game(2)"></button>
            <button class="fs-1 btn btn-outline-success block" onclick="game(3)"></button>
        </div>
        <div class="d-flex">
            <button class="fs-1 btn btn-outline-success block" onclick="game(4)"></button>
            <button class="fs-1 btn btn-outline-success block" onclick="game(5)"></button>
            <button class="fs-1 btn btn-outline-success block" onclick="game(6)"></button>
        </div>
        <div class="d-flex">
            <button class="fs-1 btn btn-outline-success block" onclick="game(7)"></button>
            <button class="fs-1 btn btn-outline-success block" onclick="game(8)"></button>
            <button class="fs-1 btn btn-outline-success block" onclick="game(9)"></button>
        </div>
    </div>
    <div class="bg-danger container shadow rounded-2 mt-3 mb-5" style="height: 35px;">
    </div>
    <h1 class="text-center rounded text-light bg-primary fw-semibold py-2 container mb-5">
        Tic Tac Toe
    </h1>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <script src="tic.js"></script>
    <script type="module">
        import Swal from 'sweetalert2'
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
